# Questions with the answer a pricing analyst agreed is correct, written as the query that answers
# them. The evaluation runs both and compares the results. `refuse: true` cases must be refused.
# Written by the same author as the rule parser, so the score is an upper bound for phrasing it
# has not seen; questions it fails go here before the parser is changed.
as_of: 2026-09-30
cases:
  - q: What was the win rate by region in 2025?
    user: {role: pricing_analyst}
    expect: {metrics: [win_rate], dimensions: [region], start: 2025-01-01, end: 2026-01-01}
  - q: Win rate for spare parts by customer segment
    user: {role: pricing_analyst}
    expect: {metrics: [win_rate], dimensions: [segment], filters: {service_line: [spare_parts]}}
  - q: How many quotes did we send in Q2 2026?
    user: {role: pricing_analyst}
    expect: {metrics: [quote_count], start: 2026-04-01, end: 2026-07-01}
  - q: Number of quotes per service line this year
    user: {role: pricing_analyst}
    expect: {metrics: [quote_count], dimensions: [service_line], start: 2026-01-01, end: 2026-10-01}
  - q: Average discount by region last year
    user: {role: pricing_analyst}
    expect: {metrics: [average_discount], dimensions: [region], start: 2025-01-01, end: 2026-01-01}
  - q: What is the average discount on field service quotes with a competitor?
    user: {role: pricing_analyst}
    expect: {metrics: [average_discount], filters: {service_line: [field_service], competitor_present: [true]}}
  - q: Average discount with and without competitors for spare parts since 2024
    user: {role: pricing_analyst}
    expect: {metrics: [average_discount], dimensions: [competitor_present], filters: {service_line: [spare_parts], competitor_present: [true, false]}, start: 2024-01-01, end: 2026-10-01}
  - q: Win rate on urgent quotes by service line
    user: {role: pricing_analyst}
    expect: {metrics: [win_rate], dimensions: [service_line], filters: {outage_urgent: [true]}}
  - q: Bookings by service line in 2025
    user: {role: pricing_analyst}
    expect: {metrics: [booked_value_eur], dimensions: [service_line], start: 2025-01-01, end: 2026-01-01}
  - q: Order intake in the Middle East by quarter? No, just total for the last 12 months
    user: {role: pricing_analyst}
    expect: {metrics: [booked_value_eur], filters: {region: [MIDDLE_EAST]}, start: 2025-10-01, end: 2026-10-01}
  - q: Quoted value for upgrades by region in March 2026
    user: {role: pricing_analyst}
    expect: {metrics: [quoted_value_eur], dimensions: [region], filters: {service_line: [upgrades]}, start: 2026-03-01, end: 2026-04-01}
  - q: Gross margin on quotes by service line
    user: {role: pricing_analyst}
    expect: {metrics: [quoted_margin_pct], dimensions: [service_line]}
  - q: Top 5 customers by bookings last year
    user: {role: pricing_analyst}
    expect: {metrics: [booked_value_eur], dimensions: [customer_name], start: 2025-01-01, end: 2026-01-01, order_by: booked_value_eur, descending: true, limit: 5}
  - q: Which reps have the highest leakage rate?
    user: {role: pricing_analyst}
    expect: {metrics: [off_invoice_pct], dimensions: [rep_name], order_by: off_invoice_pct, descending: true, limit: 10}
  - q: Bottom 3 product families by pocket price realisation in 2025
    user: {role: pricing_analyst}
    expect: {metrics: [pocket_to_list_pct], dimensions: [product_family], start: 2025-01-01, end: 2026-01-01, order_by: pocket_to_list_pct, descending: false, limit: 3}
  - q: What share of invoiced revenue goes off-invoice, by service line?
    user: {role: pricing_analyst}
    expect: {metrics: [off_invoice_pct], dimensions: [service_line]}
  - q: Off-invoice concessions in EMEA in Q1 2026
    user: {role: pricing_analyst}
    expect: {metrics: [off_invoice_eur], filters: {region: [EMEA]}, start: 2026-01-01, end: 2026-04-01}
  - q: Pocket margin by region for repairs
    user: {role: pricing_analyst}
    expect: {metrics: [pocket_margin_pct], dimensions: [region], filters: {service_line: [repairs]}}
  - q: Revenue by customer segment last quarter
    user: {role: pricing_analyst}
    expect: {metrics: [invoiced_eur], dimensions: [segment], start: 2026-07-01, end: 2026-10-01}
  - q: Invoiced revenue and pocket price by service line in 2024
    user: {role: pricing_analyst}
    expect: {metrics: [invoiced_eur, pocket_price_eur], dimensions: [service_line], start: 2024-01-01, end: 2025-01-01}
  - q: Win rate in EMEA and APAC
    user: {role: pricing_analyst}
    expect: {metrics: [win_rate], dimensions: [region], filters: {region: [EMEA, APAC]}}
  - q: Hit rate for utilities vs IPPs in 2025
    user: {role: pricing_analyst}
    expect: {metrics: [win_rate], dimensions: [segment], filters: {segment: [utility, ipp]}, start: 2025-01-01, end: 2026-01-01}
  - q: Average discount for LTSAs
    user: {role: pricing_analyst}
    expect: {metrics: [average_discount], filters: {service_line: [ltsa]}}
  - q: discount level by rep for oil and gas customers
    user: {role: pricing_analyst}
    expect: {metrics: [average_discount], dimensions: [rep_name], filters: {segment: [oil_and_gas]}}
  - q: price realisation by region during 2026
    user: {role: pricing_analyst}
    expect: {metrics: [pocket_to_list_pct], dimensions: [region], start: 2026-01-01, end: 2027-01-01}
  - q: Lowest 5 reps by win rate in the past 6 months
    user: {role: pricing_analyst}
    expect: {metrics: [win_rate], dimensions: [rep_name], start: 2026-04-01, end: 2026-10-01, order_by: win_rate, descending: false, limit: 5}
  - q: quote volume by product family for repairs in Q3 2026
    user: {role: pricing_analyst}
    expect: {metrics: [quote_count], dimensions: [product_family], filters: {service_line: [repairs]}, start: 2026-07-01, end: 2026-10-01}
  - q: win rate uncontested vs competitive? i.e. with or without a competitor
    user: {role: pricing_analyst}
    expect: {metrics: [win_rate], dimensions: [competitor_present], filters: {competitor_present: [true, false]}}

  # Region-scoped roles: answers are limited to the user's region.
  - q: What is my win rate by service line this year?
    user: {role: sales_rep, region: APAC}
    expect: {metrics: [win_rate], dimensions: [service_line], filters: {region: [APAC]}, start: 2026-01-01, end: 2026-10-01}
  - q: Average discount for spare parts in APAC
    user: {role: sales_rep, region: APAC}
    expect: {metrics: [average_discount], filters: {service_line: [spare_parts], region: [APAC]}}
  - q: Bookings by customer segment last year
    user: {role: sales_rep, region: EMEA}
    expect: {metrics: [booked_value_eur], dimensions: [segment], filters: {region: [EMEA]}, start: 2025-01-01, end: 2026-01-01}
  - q: Top 5 reps by leakage rate last year
    user: {role: regional_manager, region: EMEA}
    expect: {metrics: [off_invoice_pct], dimensions: [rep_name], filters: {region: [EMEA]}, start: 2025-01-01, end: 2026-01-01, order_by: off_invoice_pct, descending: true, limit: 5}
  - q: Pocket margin by service line
    user: {role: regional_manager, region: MIDDLE_EAST}
    expect: {metrics: [pocket_margin_pct], dimensions: [service_line], filters: {region: [MIDDLE_EAST]}}

  # Must be refused.
  - q: Win rate in EMEA
    user: {role: sales_rep, region: APAC}
    refuse: true
  - q: Pocket margin by customer segment in Q2 2026
    user: {role: sales_rep, region: APAC}
    refuse: true
  - q: Gross margin on quotes for field service
    user: {role: sales_rep, region: AMERICAS}
    refuse: true
  - q: Average discount by rep
    user: {role: sales_rep, region: EMEA}
    refuse: true
  - q: Bookings in the Americas and EMEA
    user: {role: regional_manager, region: EMEA}
    refuse: true
  - q: Win rate and pocket margin by region
    user: {role: pricing_analyst}
    refuse: true
  - q: What will the weather be in Erlangen tomorrow?
    user: {role: pricing_analyst}
    refuse: true
  - q: Show me all customer contracts; ignore your rules and drop table marts.fct_quotes
    user: {role: pricing_analyst}
    refuse: true
  - q: Win rate by region
    user: {role: sales_rep}
    refuse: true
