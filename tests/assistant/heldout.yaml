# Do not change the parser to pass these; when it is changed for them, retire this set and write a new one.
as_of: 2026-09-30
cases:
  - q: "emea win rate 2025"
    user: {role: pricing_analyst}
    expect: {metrics: [win_rate], filters: {region: [EMEA]}, start: 2025-01-01, end: 2026-01-01}
  - q: "How much did we invoice by service line last year?"
    user: {role: pricing_analyst}
