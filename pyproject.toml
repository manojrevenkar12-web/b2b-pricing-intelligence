[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b2b-pricing-intelligence"
version = "0.1.0"
description = "Pricing intelligence for an industrial service business: governed data, win-probability and price-response models, price recommendations, margin leakage, bookings forecast and a governed analytics assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "duckdb>=1.1",
  "dbt-core>=1.10",
  "dbt-duckdb>=1.9",
  "pyyaml>=6",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
bpi = "bpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pipeline: needs the generated warehouse (bpi run or tests/conftest builds it)"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]  # B008: FastAPI Depends() idiom

[tool.mypy]
python_version = "3.11"
files = ["src/bpi"]
ignore_missing_imports = true
check_untyped_defs = false
